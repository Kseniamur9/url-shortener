services:
  postgres:
    image: postgres:16
    container_name: url_postgres
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: url_redis
    ports:
      - "6379:6379"